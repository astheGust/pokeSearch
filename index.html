<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon</title>
    <script src="./clientSide.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #fffacd;
            background-image:
                radial-gradient(circle, #FFD700 2px, transparent 2px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        form {
            margin: auto;
            max-width: 200px;
            max-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input[type="text"] {
            width: 200px;
            height: 14px;
            margin-top: 6px;
            padding: 7px 12px;
            font-size: 16px;
            border: 2px solid #FFD700;
            border-radius: 8px;
            background-color: #fff;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #FF6B6B;
            box-shadow: 0 0 7px rgba(255, 107, 107, 0.5);
            background-color: #fffacd;
        }

        input[type="submit"] {
            margin-top: 6px;
            color: white;
            letter-spacing: 2px;
            padding: 4px 10px;
            font-size: 14px;
            background: linear-gradient(135deg, #FF6B6B, #FFD93D);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="submit"]:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
        }

        #content {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: auto;
            width: auto;
            height: auto;
        }

        #pokeName {
            font-size: 20px;
            font-family: monospace;
        }

        #pokeImg {
            width: 200px;
            height: 180px;
            object-fit: contain;
            border: 8px solid;
            border-image: linear-gradient(45deg, #FF6B6B, #FFD93D, #6BCB77, #4D96FF, #FF6B9D)1;
            border-radius: 10px;
        }

        #stats {
            margin-top: 15px;
            list-style: none;
            width: 240px;
            background-color: white;
            padding: 10px;
        }

        ul#stats li {
            display: flex;
            position: relative;
            margin: 8px 0;
        }

        ul#stats li img {
            width: 26px;
            height: 24px;
            margin-right: 8px;
        }

        ul#stats li p {
            z-index: 9999;
            color: white;
            font-size: 16px;
            margin-left: 4px;
        }

        li p.statNumber {
            position: absolute;
            right: 10px;
            letter-spacing: 2px;
            color: white;
        }

        .bar {
            height: 18px;
            width: 200px;
            margin-left: 36px;
            background-color: blue;
            position: absolute;
            z-index: 1;
            border-radius: 0 8px 8px 0;
        }
    </style>
</head>

<body>
    <form>
        <label for="name"><input id="name" placeholder="Pokemon" type="text"></label>
        <input id="button" type="submit">
    </form>

    <section id="content">
        <h3 id="pokeName">NOME</h3>
        <img id="pokeImg" src="#">
        <ul id="stats">
            <li>
                <img src="./imgs/001-heart.png">
                <p>Hp</p>
                <p class="statNumber"></p>
                <span class="bar"></span>

            </li>
            <li>
                <img src="./imgs/002-sword.png">
                <p>Ataque</p>
                <p class="statNumber"></p>
                <span class="bar">d</span>

            </li>
            <li>
                <img src="./imgs/003-sword-1.png">
                <p>Spc.Ataque</p>
                <p class="statNumber"></p>
                <span class="bar"></span>

            </li>
            <li>
                <img src="./imgs/004-shield.png">
                <p>Defesa</p>
                <p class="statNumber"></p>
                <span class="bar"></span>

            </li>
            <li>
                <img src="./imgs/005-security.png">
                <p>Spc.Defesa</p>
                <p class="statNumber"></p>
                <span class="bar"></span>

            </li>
            <li>
                <img src="./imgs/006-boot-with-lightning.png">
                <p>Velocidade</p>
                <p class="statNumber"></p>
                <span class="bar"></span>

            </li>
        </ul>
    </section>
</body>

</html>
